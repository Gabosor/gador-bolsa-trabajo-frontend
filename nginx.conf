server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Estos archivos deciden qué versión usa la PWA: nunca se guardan en caché.
  location ~ ^/(index\.html|sw\.js|registerSW\.js)$ {
    add_header Cache-Control "no-cache";
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }

  # Android lo lee para abrir el APK (TWA) sin la barra del navegador.
  location = /.well-known/assetlinks.json {
    default_type application/json;
    add_header Cache-Control "no-cache";
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Las rutas de Vue las resuelve el navegador.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
